<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{font-family:var(--font-sans);color:var(--foreground)}
body{margin:0}figure{margin:0}figcaption{font-weight:500;margin-bottom:8px}.legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px;color:var(--muted-foreground)}.legend .dot{color:var(--chart-1)}.legend .square{color:var(--chart-2)}.entry{margin-bottom:14px}.labels{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.labels span:last-child{font-variant-numeric:tabular-nums;color:var(--muted-foreground)}.track{position:relative;height:20px;margin:0 7px;border-bottom:1px solid var(--border)}.range{position:absolute;height:2px;top:9px;background:var(--border)}.median,.p90{position:absolute;top:6px;width:8px;height:8px;transform:translateX(-50%);background:var(--chart-1)}.median{border-radius:50%}.p90{background:var(--chart-2)}.axis{position:relative;height:24px;margin:0 7px}.axis span{position:absolute;transform:translateX(-50%);color:var(--muted-foreground)}.axis span:first-child{transform:none}.axis span:last-child{transform:translateX(-100%)}.caption{color:var(--muted-foreground);margin:4px 0 0}
</style></head><body><figure aria-label="KV260 CPU offline latency, median and 90th percentile for each model">
<figcaption>KV260 CPU: full-clip-to-final latency</figcaption>
<div class="legend"><span><span class="dot">●</span> Median / <span class="square">■</span> p90</span><span>40 clips · 307.17 seconds of audio</span></div>
<!--ROWS-->
<div class="axis"><!--TICKS--></div>
<p class="caption">Processing time in seconds · logarithmic scale · lower is faster</p>
</figure></body></html>

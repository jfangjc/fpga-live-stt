# stt-caption settings; apply with sudo systemctl restart stt-caption
# Runner: hybrid (the FPGA engine) or cpu (INT8 on the A53s, needs quartznet_int8.bin)
RUNNER=hybrid
# Captions on the monitor: yes, or no to print them to the session log only
DISPLAY_CAPTIONS=yes
# A status strip under the captions (speaking dot, mic level, decode time, caption delay): yes or no
DISPLAY_STATUS=yes
# Clear the screen after this many seconds of silence; 0 keeps the captions on screen
CLEAR_AFTER=5
# Screen colours: butter (pastel yellow, matches the poster) or night (dark, easier on the eyes for long viewing)
THEME=butter
# Previews that must agree before a word turns settled (dark) and stays settled: 2-8; 0 = the previous preview only
SETTLE=3
